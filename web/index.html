<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <title>Atlas</title>
  <meta name="description" content="Gizli ili ya da ülkeyi bul! Her tahmin, gizli yere ne kadar yakın olduğunu haritada renklerle gösterir. Türkiye, kıtalar ve tüm dünya.">
  <meta name="theme-color" content="#142030">
  <meta property="og:title" content="Atlas · İl ve Ülke Bulmaca">
  <meta property="og:description" content="Gizli ili ya da ülkeyi bul! Her tahmin haritada sıcak–soğuk renklerle gösterilir.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="icons/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
  <script>
    // Kaydedilmiş tema tercihini sayfa çizilmeden uygula (renk sıçramasını önler).
    try {
      const t = JSON.parse(localStorage.getItem('atlas.theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <!-- Açılış: pin düşer, dalga yayılır, isim belirir; veri gecikirse pin süzülür (brand.js). -->
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-pin">
      <div class="splash-ripple"></div>
      <div class="splash-drop"><svg class="mark splash-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 94 C50 94 16 60 16 38 A34 34 0 1 1 84 38 C84 60 50 94 50 94Z" fill="var(--splash-pin)"/><circle cx="50" cy="38" r="20" fill="none" stroke="var(--splash-bg)" stroke-width="4"/><line x1="30" y1="38" x2="70" y2="38" stroke="var(--brand-orange)" stroke-width="4"/><ellipse class="meridian" cx="50" cy="38" rx="8" ry="20" fill="none" stroke="var(--splash-bg)" stroke-width="4"/></svg></div>
      <div class="splash-shadow"></div>
    </div>
    <div class="splash-word">Atlas</div>
  </div>
  <div class="app" id="app">
    <header class="toolbar">
      <div class="toolbar-left">
        <span class="brand"><svg class="mark brand-mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 94 C50 94 16 60 16 38 A34 34 0 1 1 84 38 C84 60 50 94 50 94Z" fill="var(--brand-pin)"/><circle cx="50" cy="38" r="20" fill="none" stroke="var(--brand-pin-lines)" stroke-width="4"/><line x1="30" y1="38" x2="70" y2="38" stroke="var(--brand-orange)" stroke-width="4"/><ellipse class="meridian" cx="50" cy="38" rx="8" ry="20" fill="none" stroke="var(--brand-pin-lines)" stroke-width="4"/></svg>Atlas</span>
        <label class="category-select" id="categoryLabel" title="Kategori">
          <span class="category-icon" id="categoryIcon">🇹🇷</span>
          <select id="categorySelect" aria-label="Kategori"></select>
        </label>
      </div>
      <div class="segmented" id="modeSegmented" role="tablist" aria-label="Mod">
        <button data-mode="daily" role="tab">Günlük</button>
        <button data-mode="practice" role="tab">Alıştırma</button>
      </div>
      <div class="toolbar-right">
        <label class="category-select lang-select" id="languageLabel" title="Dil">
          <span id="languageFlag">🇹🇷</span>
          <select id="languageSelect" aria-label="Dil"></select>
        </label>
        <button class="icon-button" id="newGameButton" title="Yeni alıştırma oyunu" aria-label="Yeni oyun" hidden>
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" /></svg>
        </button>
        <button class="icon-button" id="themeButton" title="Aydınlık / karanlık tema" aria-label="Temayı değiştir">
          <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        </button>
        <button class="icon-button" id="statsButton" title="İstatistikler" aria-label="İstatistikler">
          <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-7" /></svg>
        </button>
        <button class="icon-button" id="settingsButton" title="Ayarlar" aria-label="Ayarlar">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        </button>
        <button class="icon-button" id="helpButton" title="Nasıl oynanır?" aria-label="Nasıl oynanır">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01"/></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="map" id="map">
        <canvas id="mapCanvas" aria-label="Harita"></canvas>
        <div class="map-tooltip" hidden></div>
        <div class="map-pill" hidden></div>
        <div class="map-legend" id="mapLegend" aria-label="Renk skalası"></div>
        <div class="zoom-controls">
          <button data-zoom="in" aria-label="Yakınlaştır">+</button>
          <button data-zoom="out" aria-label="Uzaklaştır">−</button>
          <button data-zoom="reset" aria-label="Haritayı sıfırla" title="Haritayı sıfırla">⤢</button>
        </div>
        <div class="loading" id="loading"></div>
      </section>

      <aside class="panel">
        <div class="panel-header">
          <div class="panel-category" id="panelCategory"></div>
          <h1 id="panelTitle"></h1>
          <p class="muted" id="panelSubtitle"></p>
        </div>

        <div id="gameOver" class="game-over" hidden></div>

        <form class="guess-form" id="guessForm" autocomplete="off">
          <div class="guess-row">
            <input id="guessInput" type="text" enterkeyhint="go" autocapitalize="words" autocorrect="off" spellcheck="false">
            <button type="submit" class="primary" id="guessButton" disabled>Tahmin et</button>
          </div>
          <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
        </form>

        <p class="feedback muted" id="feedback"></p>
        <div class="closest" id="closest" hidden></div>
        <div class="hints" id="hints" hidden></div>

        <div class="guesses" id="guesses"></div>

        <footer class="panel-footer">
          <span class="muted" id="guessCount">0 tahmin</span>
          <button class="link danger" id="giveUpButton" hidden>Pes et</button>
        </footer>
      </aside>
    </main>
  </div>

  <dialog id="resultDialog" class="sheet"></dialog>
  <dialog id="statsDialog" class="sheet wide"></dialog>
  <dialog id="helpDialog" class="sheet"></dialog>
  <dialog id="settingsDialog" class="sheet"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
